<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Демо Tailwind CSS</title>
    <!-- Tailwind Play CDN (для навчання та прототипування) -->
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body>
    <nav class="bg-slate-900 text-white shadow-lg">
      <div
        class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between"
      >
        <!-- Логотип -->
        <a
          href="#"
          class="text-xl font-bold tracking-tight text-white hover:text-indigo-400 transition"
        >
          DevBrand
        </a>

        <!-- Кнопка гамбургера для мобільних пристроїв -->
        <button
          class="md:hidden p-2 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500"
        >
          <svg
            class="w-6 h-6"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M4 6h16M4 12h16M4 18h16"
            ></path>
          </svg>
        </button>

        <!-- Меню десктопу: приховане на телефонах, видиме від md -->
        <div class="hidden md:flex items-center space-x-6">
          <a
            href="#"
            class="text-slate-300 hover:text-white transition font-medium"
            >Головна</a
          >
          <a
            href="#"
            class="text-slate-300 hover:text-white transition font-medium"
            >Можливості</a
          >
          <a
            href="#"
            class="text-slate-300 hover:text-white transition font-medium"
            >Ціни</a
          >
          <a
            href="#"
            class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-lg font-medium transition shadow hover:shadow-indigo-500/25"
          >
            Увійти
          </a>
        </div>
      </div>
    </nav>
  </body>
</html>
